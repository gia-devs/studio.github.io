<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>G’IA — Plataforma de ideas, artistas y pensamiento</title>
  <meta name="description" content="G’IA es una plataforma para explorar ideas, artistas y pensamiento; conversa con Aion.">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views/home.css">
  <link rel="stylesheet" href="css/views/figures.css">
  <link rel="stylesheet" href="css/views/figure.css">
  <link rel="stylesheet" href="css/views/community.css">
  <link rel="stylesheet" href="css/views/account.css">
</head>
<body>
  <a class="skip-link" href="#view">Saltar al contenido</a>

  <div class="app" id="app">
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="sidebar__head">
        <a class="brand" href="#/home" aria-label="G’IA, ir a Home">
          <span class="brand__word">G’IA</span>
        </a>
        <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-controls="side-nav" aria-expanded="true" aria-label="Contraer menú"></button>
      </div>
      <nav id="side-nav" class="side-nav" aria-label="Secciones"></nav>
      <p class="sidebar__foot">PLATAFORMA DE IDEAS · ARTE · PENSAMIENTO</p>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <a class="topbar__brand" href="#/home" aria-label="G’IA, ir a Home">
          <span class="brand__word">G’IA</span>
        </a>
        <button class="topbar__search" id="open-search" type="button" aria-label="Buscar filósofos y artistas">
          <span data-slot="icon"></span>
          <span class="topbar__search-text">Buscar filósofos y artistas</span>
          <kbd class="kbd">/</kbd>
        </button>
        <span class="topbar__spacer"></span>
        <button class="account-btn" id="account-btn" type="button"></button>
      </header>

      <main id="view" tabindex="-1" aria-live="polite"></main>
    </div>

    <nav class="bottombar" id="bottom-nav" aria-label="Navegación móvil"></nav>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript>
    <p style="padding:24px;color:#fff;font-family:sans-serif">G’IA necesita JavaScript para funcionar.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
