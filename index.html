    <script src="script.js"></script>
    <script>
// Seleccionamos los elementos necesarios
const buttons = document.querySelectorAll('.category-btn');
const sections = document.querySelectorAll('.content-section');
const menuToggle = document.getElementById('menuToggle');
const aside = document.querySelector('aside');

// Lógica para abrir/cerrar el menú desplegable en móvil
if (menuToggle && aside) {
    menuToggle.addEventListener('click', () => {
        aside.classList.toggle('active');
        // Cambiamos el texto del botón según el estado
        if (aside.classList.contains('active')) {
            menuToggle.textContent = 'CLOSE';
        } else {
            menuToggle.textContent = 'MENU';
        }
    });
}

// Lógica para cambiar de sección
buttons.forEach(button => {
  button.addEventListener('click', (e) => {
    e.preventDefault();
    
    // 1. Quitamos la clase "active" de todos los botones
    buttons.forEach(btn => btn.classList.remove('active'));
    
    // 2. Le ponemos "active" al botón pulsado
    button.classList.add('active');
    
    // 3. Obtenemos la sección destino
    const sectionId = button.dataset.section;
    
    // 4. Ocultamos las secciones anteriores
    sections.forEach(section => section.classList.remove('active'));
    
    // 5. Activamos la nueva sección
    const targetSection = document.getElementById(sectionId);
    if (targetSection) {
      targetSection.classList.add('active');
    }

    // 6. Si estamos en versión móvil, cerramos el menú desplegable al hacer clic
    if (window.innerWidth <= 768) {
        aside.classList.remove('active');
        if (menuToggle) menuToggle.textContent = 'MENU';
    }
  });
});
    </script>
