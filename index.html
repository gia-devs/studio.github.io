<template id="tpl-form">

        <div class="elemento">
            <h4><code>&lt;<span class="tag">form</span>&gt;</code></h4>
            <h2>FORM<span></span></h2>
            <h4><code>&lt;<span class="tag">fieldset</span>&gt;<br>&lt;<span class="tag">legend</span>&gt;</code></h4>
        </div>

        <ul>
            <li>HTML</li>
            <li>01 / 03 →</li>
        </ul>
    </article>

    <article>
        <ul>
            <li>FORM</li>
            <li>02 / 03 →</li>
        </ul>

        <h3>Contenedor para recopilar y enviar datos.</h3>

<p>
            El elemento <code>&lt;<span class="tag">form</span>&gt;</code>
            representa una sección que contiene controles interactivos
            destinados a recopilar información del usuario y enviarla
            para su procesamiento. Dentro de un formulario pueden utilizarse elementos como
            <code>&lt;<span class="tag">label</span>&gt;</code>,
            <code>&lt;<span class="tag">input</span>&gt;</code>,
            <code>&lt;<span class="tag">textarea</span>&gt;</code>,
            <code>&lt;<span class="tag">select</span>&gt;</code>,
            <code>&lt;<span class="tag">option</span>&gt;</code> y
            <code>&lt;<span class="tag">button</span>&gt;</code>.
        </p>

        <p>
            Para organizar controles relacionados se pueden utilizar
            <code>&lt;<span class="tag">fieldset</span>&gt;</code> y
            <code>&lt;<span class="tag">legend</span>&gt;</code>.
            <code>&lt;<span class="tag">fieldset</span>&gt;</code>
            agrupa los controles y
            <code>&lt;<span class="tag">legend</span>&gt;</code>
            proporciona el título del grupo.
        </p>

        <p>
            Atributos clave como <code><span class="attribute">action</span></code> definen la URL de destino del envío y <code><span class="attribute">method</span></code> especifica el protocolo HTTP (como GET o POST) para transmitir los datos de forma segura.
        </p>
    </article>

    <article>
        <div class="code-window">
            <div class="window-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>

            <div class="window-body">
<code>
                    &lt;<span class="tag">form</span> <span class="attribute">action</span>=<span class="value">"/enviar"</span> <span class="attribute">method</span>=<span class="value">"POST"</span>&gt;
                    <br>&nbsp;&nbsp;&lt;<span class="tag">fieldset</span>&gt;
                    <br>&nbsp;&nbsp;&nbsp;&nbsp;&lt;<span class="tag">legend</span>&gt;Information&lt;/<span class="tag">legend</span>&gt;
                    <br>&nbsp;&nbsp;&nbsp;&nbsp;&lt;<span class="tag">label</span>
                    <span class="attribute">for</span>=<span class="value">"email"</span>&gt;Email&lt;/<span class="tag">label</span>&gt;
                    <br>&nbsp;&nbsp;&nbsp;&nbsp;&lt;<span class="tag">input</span>
                    <span class="attribute">type</span>=<span class="value">"email"</span>
                    <span class="attribute">id</span>=<span class="value">"email"</span>
                    <br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="attribute">name</span>=<span class="value">"email"</span>
                    <br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="attribute">placeholder</span>=<span class="value">"email@example.com"</span><span class="tag"></span>&gt;
                    <br>&nbsp;&nbsp;&lt;/<span class="tag">fieldset</span>&gt;
                    <br>&lt;/<span class="tag">form</span>&gt;
                </code>
            </div>
        </div>

<div class="ejemplo">
            <form>

                <fieldset>
                <legend>INFORMATION</legend>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" autocomplete="email">
                </div>
                </fieldset>

            </form>
        </div>

        <ul>
            <li>← 03 / 03</li>
            <li><div class="tag-li"></div>TAG</li>
            <li><div class="attribute-li"></div>ATTRIBUTE</li>
            <li><div class="value-li"></div>VALUE</li>
        </ul>
    </article>
</template>
<template id="tpl-input-label">
    <article>
        <ul>
            <li>FORM<br>CONTROL</li>
            <li>VOID<br>ELEMENT</li>
            <li>DISPLAY<br>INLINE-BLOCK</li>
        </ul>

        <div class="elemento">
            <h4><code>&lt;<span class="tag">label</span>&gt;</code></h4>
            <h2>LABEL<br>INPUT<span></span></h2>
            <h4><code>&lt;<span class="tag">input</span>&gt;</code></h4>
        </div>

        <ul>
            <li>HTML</li>
            <li>01 / 03 →</li>
        </ul>
    </article>

    <article>
        <ul>
            <li>LABEL / INPUT</li>
            <li>02 / 03 →</li>
        </ul>

        <h3>Control para introducir datos.</h3>

        <p>
            El elemento <code>&lt;<span class="tag">input</span>&gt;</code> es un elemento de autocierre que permite al usuario introducir o seleccionar datos en un formulario.
            Su comportamiento y aspecto cambian según el atributo <code><span class="attribute">type</span></code>, que define la naturaleza del control, a continuación los mas usados:
        </p>

        <p>
            <code><span class="attribute">type</span>=<span class="value">"text | password | email | number | search | url | tel |
                checkbox | radio | file | color | range | date | time | submit | reset | button | image"</span></code>
        </p>

        <p>
            El atributo <code><span class="attribute">id</span></code> identifica de forma única al elemento y permite vincularlo con su etiqueta <code>&lt;<span class="tag">label</span>&gt;</code> mediante el atributo <code><span class="attribute">for</span></code>.
            Por otro lado <code><span class="attribute">name</span></code> define la clave con la que viajan los datos hacia el servidor al enviar el formulario, y <code><span class="attribute">form</span></code> permite asociar el input a un formulario específico.
        </p>
    </article>

    <article>
        <div class="code-window">
            <div class="window-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>

            <div class="window-body">
                <code>
                    &lt;<span class="tag">form</span>&gt;

                    <br>&nbsp;&nbsp;&lt;<span class="tag">label</span>
                    <span class="attribute">form</span>=<span class="value">"text"</span>&gt;text&lt;/<span class="tag">label</span>&gt;

                    <br>
                    &nbsp;&nbsp;&lt;<span class="tag">input</span>
                    <span class="attribute">type</span>=<span class="value">"text"</span>
                    <span class="attribute">id</span>=<span class="value">"text"</span>
                    <br>&nbsp;&nbsp;<span class="attribute">name</span>=<span class="value">"text"</span><span class="tag"></span>
                    <span class="attribute">placeholder</span>=<span class="value">"text..."</span>&gt;

                    <br>
                    <br>&nbsp;&nbsp;&lt;<span class="tag">label</span>
                    <span class="attribute">form</span>=<span class="value">"number"</span>&gt;number&lt;/<span class="tag">label</span>&gt;

                    <br>
                    &nbsp;&nbsp;&lt;<span class="tag">input</span>
                    <span class="attribute">type</span>=<span class="value">"number"</span>
                    <span class="attribute">id</span>=<span class="value">"number"</span>
                    <br>&nbsp;&nbsp;<span class="attribute">name</span>=<span class="value">"number"</span><span class="tag"></span>
                    <span class="attribute">placeholder</span>=<span class="value">"123..."</span>&gt;

                    <br>&lt;/<span class="tag">form</span>&gt;
                </code>
            </div>
        </div>

        <div class="ejemplo">
            <fieldset>
                <legend>TEXT & NUMBER</legend>

                <div class="field2">
                    <div class="field">
                        <label for="text">Text</label>
                        <input type="text" id="text" name="text" placeholder="text..." required>
                    </div>
                    <div class="field">
                        <label for="number">Number</label>
                        <input type="number" id="number" name="number" placeholder="123...">
                    </div>
                </div>
            </fieldset>
            </div>

        </div>

        <ul>
            <li>← 03 / 03</li>
            <li><div class="tag-li"></div>TAG</li>
            <li><div class="attribute-li"></div>ATTRIBUTE</li>
            <li><div class="value-li"></div>VALUE</li>
        </ul>
    </article>
</template>
<template id="tpl-select-option">
    <article>
        <ul>
            <li>INTERACTIVE<br>ELEMENT</li>

        </ul>

        <div class="elemento">
            <h4><code>&lt;<span class="tag">select</span>&gt;</code></h4>
            <h2>SELECT<br>OPTION</h2>
            <h4><code>&lt;<span class="tag">option</span>&gt;</code></h4>
        </div>

        <ul>
            <li>HTML</li>
            <li>01 / 03 →</li>
        </ul>
    </article>

    <article>
        <ul>
            <li>SELECT / OPTION</li>
            <li>02 / 03 →</li>
        </ul>

        <h3>Elementos para seleccionar opciones.</h3>
<p>
    El elemento <code>&lt;<span class="tag">select</span>&gt;</code>
    representa un control de formulario que permite al usuario elegir
    una opción de una lista desplegable.
    Cada elemento de la lista se define mediante 
    <code>&lt;<span class="tag">option</span>&gt;</code>.
</p>

<p>
    <code>&lt;<span class="tag">select</span> <span class="attribute">name</span>=<span class="value">"..."</span>&gt;</code><br>
    Identifica el campo cuando se envían los datos del formulario.
</p>

<p>
    <code>&lt;<span class="tag">option</span> <span class="attribute">value</span>=<span class="value">"es"</span>&gt;</code><br>
    Define el valor interno que se enviará al servidor al seleccionarla.
</p>
    </article>

    <article>
        <div class="code-window">
            <div class="window-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>

            <div class="window-body">
                <code>
                    &lt;<span class="tag">form</span>&gt;
                    <br>&nbsp;&nbsp;&lt;<span class="tag">label</span> <span class="attribute">for</span>=<span class="value">"lang"</span>&gt;Languages&lt;/<span class="tag">label</span>&gt;
                    <br>&nbsp;&nbsp;&lt;<span class="tag">select</span> <span class="attribute">id</span>=<span class="value">"lang"</span> <span class="attribute">name</span>=<span class="value">"lang"</span>&gt;
                    <br>&nbsp;&nbsp;&nbsp;&nbsp;&lt;<span class="tag">option</span> <span class="attribute">value</span>=<span class="value">"es"</span>&gt; Español
                    <br>&nbsp;&nbsp;&nbsp;&nbsp;&lt;<span class="tag">/option</span>&gt;
                    <br>&nbsp;&nbsp;&nbsp;&nbsp;&lt;<span class="tag">option</span> <span class="attribute">value</span>=<span class="value">"en"</span>&gt; English
                    <br>&nbsp;&nbsp;&nbsp;&nbsp;&lt;<span class="tag">/option</span>&gt;
                    <br>
                    &nbsp;&nbsp;&lt;/<span class="tag">select</span>&gt;
                    <br>&lt;<span class="tag">form</span>&gt;
                </code>
            </div>
        </div>

        <div class="ejemplo">
            <form action="#" method="post">
                <fieldset>
                    <legend>SELECT</legend>
                    <div class="field">
                        <label for="country">Languages</label>
                        <select id="country" name="country">
                            <option value="" disabled selected>Select a language</option>
                            <option value="es">Español</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                </fieldset>
            </form>
        </div>

        <ul>
            <li>← 03 / 03</li>
            <li><div class="tag-li"></div>TAG</li>
            <li><div class="attribute-li"></div>ATTRIBUTE</li>
            <li><div class="value-li"></div>VALUE</li>
        </ul>
    </article>
</template>
<template id="tpl-textarea">
    <article>
        <ul>
            <li>FORM<br>CONTROL</li>
            <li>FORM-ASSOCIATED<br>ELEMENT</li>
            <li>DISPLAY<br>INLINE-BLOCK</li>
        </ul>

        <div class="elemento">
            <h2>TEXT<br>AREA<span></span></h2>
            <h4><code>&lt;<span class="tag">textarea</span>&gt;</code></h4>
        </div>

        <ul>
            <li>HTML</li>
            <li>01 / 03 →</li>
        </ul>
    </article>

    <article>
        <ul>
            <li>TEXTAREA</li>
            <li>02 / 03 →</li>
        </ul>

        <h3>Control para introducir texto de varias líneas.</h3>
<p>
            El elemento <code>&lt;<span class="tag">textarea</span>&gt;</code>
            representa un control de formulario que permite al usuario escribir
            y editar texto en múltiples líneas.
        </p>

        <p>
            A diferencia de <code>&lt;<span class="tag">input</span>&gt;</code>,
            está diseñado para contenidos más extensos, como comentarios,
            mensajes o descripciones.
        </p>

        <p>
            <code>&lt;<span class="tag">textarea</span> <span class="attribute">name</span>=<span class="value">"mensaje"</span>&gt;&lt;/<span class="tag">textarea</span>&gt;</code><br>
            Requiere una etiqueta de cierre y el atributo name para identificar los datos enviados.
        </p>

        <p>
            <code>&lt;<span class="tag">textarea</span> <span class="attribute">rows</span>=<span class="value">"4"</span> <span class="attribute">cols</span>=<span class="value">"50"</span>&gt;&lt;/<span class="tag">textarea</span>&gt;</code><br>
            Define el tamaño inicial en filas y columnas (aunque hoy se suele controlar con CSS).
        </p>
    </article>

    <article>
        <div class="code-window">
            <div class="window-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>

            <div class="window-body">
                <code>
                    &lt;<span class="tag">form</span>&gt;
                    <br>&lt;<span class="tag">label</span> <span class="attribute">for</span>=<span class="value">"message"</span>&gt;Textarea&lt;/<span class="tag">label</span>&gt;
                    <br>&nbsp;&nbsp;&lt;<span class="tag">textarea</span> 
                    <br>&nbsp;&nbsp;<span class="attribute">id</span>=<span class="value">"message"</span> 
                    <br>&nbsp;&nbsp;<span class="attribute">name</span>=<span class="value">"message"</span>
                    <br>&nbsp;&nbsp;<span class="attribute">rows</span>=<span class="value">"3"</span><span class="tag"></span>
                    <br>&nbsp;&nbsp;Write your message...
                    <br>&nbsp;&nbsp;&lt;/<span class="tag">textarea</span>&gt;
                    <br>&lt;/<span class="tag">form</span>&gt;
                </code>
            </div>
        </div>

        <div class="ejemplo">
            <fieldset>
                <legend>TEXTAREA</legend>
                <div class="field">
                    <label for="textarea">Textarea</label>
                    <textarea id="textarea" name="textarea" rows="2" placeholder="Write your message..."></textarea>
                </div>
            </fieldset>
        </div>

        <ul>
            <li>← 03 / 03</li>
            <li><div class="tag-li"></div>TAG</li>
            <li><div class="attribute-li"></div>ATTRIBUTE</li>
            <li><div class="value-li"></div>VALUE</li>
        </ul>
    </article>
</template>
<template id="tpl-button">
    <article>
        <ul>
            <li>INTERACTIVE<br>ELEMENT</li>
            <li>FORM<br>CONTROL</li>
            <li>DISPLAY<br>INLINE-BLOCK</li>
        </ul>

        <div class="elemento">
            <h2>BUTTON<span></span></h2>
            <h4><code>&lt;<span class="tag">button</span>&gt;</code></h4>
        </div>

        <ul>
            <li>HTML</li>
            <li>01 / 03 →</li>
        </ul>
    </article>

<article>
        <ul>
            <li>BUTTON</li>
            <li>02 / 03 →</li>
        </ul>

        <h3>Elemento interactivo.</h3>
<p>
    El elemento <code>&lt;<span class="tag">button</span>&gt;</code> representa un botón interactivo que el usuario puede activar para realizar una acción, como enviar un formulario, restablecer sus datos o interactuar con scripts.
    Su comportamiento depende fundamentalmente del atributo <code><span class="attribute">type</span></code>.
</p>

<p>
    <code>&lt;<span class="tag">button</span> <span class="attribute">type</span>=<span class="value">"submit"</span><span class="tag"></span>&gt;</code><br>Envía los datos del formulario al servidor por defecto.
</p>

<p>
    <code>&lt;<span class="tag">button</span> <span class="attribute">type</span>=<span class="value">"reset"</span><span class="tag"></span>&gt;</code><br>Restablece todos los campos del formulario a sus valores iniciales.
</p>

<p>
    <code>&lt;<span class="tag">button</span> <span class="attribute">type</span>=<span class="value">"button"</span><span class="tag"></span>&gt;</code><br>Botón genérico sin comportamiento predeterminado, ideal para programar acciones con JavaScript.
</p>
</article>

    <article>
        <div class="code-window">
            <div class="window-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>

            <div class="window-body">
                <code>
                    &lt;<span class="tag">form</span>&gt;
                    <br>&nbsp;&nbsp;&lt;<span class="tag">button</span> <span class="attribute">type</span>=<span class="value">"submit"</span>&gt; Submit
                    <br>&nbsp;&nbsp;&lt;/<span class="tag">button</span>&gt;
                    <br>
                    <br>&nbsp;&nbsp;&lt;<span class="tag">button</span> <span class="attribute">type</span>=<span class="value">"reset"</span>&gt; Reset 
                    <br>&nbsp;&nbsp;<span class="tag">&lt;/button&gt;</span>
                    <br>
                    <br>&nbsp;&nbsp;&lt;<span class="tag">button</span> <span class="attribute">type</span>=<span class="value">"button"</span>&gt; Action
                    <br>&nbsp;&nbsp;&lt;/<span class="tag">button</span>&gt;<br>
                    &lt;/<span class="tag">form&gt;</span>
                </code>
            </div>
        </div>
        <div class="ejemplo">
            <fieldset>
                <legend>BUTTONS</legend>
                <div class="field2">
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                    <button type="button">Action</button>
                </div>
            </fieldset>
        </div>
        <ul>
            <li>← 03 / 03</li>
            <li><div class="tag-li"></div>TAG</li>
            <li><div class="attribute-li"></div>ATTRIBUTE</li>
            <li><div class="value-li"></div>VALUE</li>
        </ul>
    </article>
</template>

        <h3>Sistema de diseño bidimensional.</h3>

<p>
    CSS Grid es un sistema de layout bidimensional que permite organizar elementos 
    en filas y columnas de forma simultánea. Al aplicar 
    <code><span class="property">display</span>: <span class="value">grid</span></code> 
    a un elemento, este se convierte en un grid container y sus hijos directos 
    se transforman automáticamente en grid items.
</p>

<p>
    El contenedor define la estructura de la cuadrícula mediante propiedades como 
    <code><span class="property">grid-template-columns</span></code>, 
    <code><span class="property">grid-template-rows</span></code> y 
    <code><span class="property">grid-template-areas</span></code>. 
    La propiedad <code><span class="property">gap</span></code> permite establecer 
    el espacio entre filas y columnas.
</p>

<p>
    Los grid items se distribuyen dentro de esta estructura y pueden ocupar una o varias 
    columnas y filas, permitiendo crear composiciones regulares o de tamaños y posiciones 
    diferentes.
</p>

    </article>

                    <br><br>.<span class="selector">grid</span> {

                    &nbsp;&nbsp;<span class="property">grid-template-columns</span>: <span class="value">1fr 1fr</span>;<br>

<h3>Columnas de la cuadrícula.</h3>

<p>
    La propiedad <code><span class="property">grid-template-columns</span></code>
    define las columnas explícitas de un <code><span class="property">grid container</span></code>
    estableciendo su número y tamaño mediante los valores especificados.
</p>


<p>
    Unidades fijas:
    <code><span class="value">px</span></code>,
    <code><span class="value">rem</span></code>
    y otras unidades de longitud.
</p>

<p>
    Unidad flexible:
    <code><span class="value">fr</span></code>
    (<em>fraction</em>) distribuye proporcionalmente el espacio disponible
    entre las columnas.
</p>

<p>
    Función <code><span class="value">repeat()</span></code>:
    permite repetir una definición de columnas.
    Por ejemplo,
    <code><span class="value">repeat(3, 1fr)</span></code>
    crea tres columnas de igual tamaño.
</p>

<p>
    Función <code><span class="value">minmax()</span></code>:
    establece un tamaño mínimo y máximo para una columna.
        Por ejemplo,
    <code><span class="value">minmax(200px, 1fr)</span></code>
    permite que la columna tenga un mínimo de
    <code><span class="value">200px</span></code>
    y pueda crecer hasta ocupar una fracción del espacio disponible.
</p>

</article>

        <h3>Define las filas de la cuadrícula.</h3>

        <p>
            La propiedad <code><span class="property">grid-template-rows</span></code>
            define las filas explícitas de un<code> <span class="property">container</span></code>,
            estableciendo su número y tamaño mediante los valores especificados.
            Cada valor representa una fila y determina el tamaño de su correspondiente
            <em>grid track</em>.
        </p>

        <p>
            El valor <code><span class="value">auto</span></code> permite que
            el tamaño de una fila se determine de acuerdo con su contenido y
            el espacio disponible.
        </p>

        <p>
            Por ejemplo,
            <code><span class="property">grid-template-rows</span>:</code> <code><span class="value">40px auto 60px</span>;</code>
            define tres filas: la primera con un tamaño de
            <code><span class="value">40px</span></code>, la segunda adaptable a su contenido
            y la tercera con un tamaño de
            <code><span class="value">60px</span></code>.
        </p>

        <p>
            Las filas definidas mediante
            <code><span class="property">grid-template-rows</span></code>
            forman parte del grid explícito.
            Si se necesitan filas adicionales, Grid puede generarlas
            automáticamente como parte del grid implícito.
        </p>
    </article>

        <p>
            La propiedad <code><span class="property">grid-template-areas</span></code>
            permite definir zonas con nombre dentro del <code><span class="property">grid container</span></code>,
            creando un mapa visual de la estructura del layout.
        </p>

        <p>
            Cada cadena de texto representa una fila, y las palabras
            dentro de ella representan las columnas. Las áreas con el
            mismo nombre se unen automáticamente formando una zona más grande.
        </p>

        <p>
            Luego, cada ítem se posiciona en una de esas zonas usando la propiedad
            <code><span class="property">grid-area</span></code>.
        </p>

        <p>
            Ejemplo:<br>
            <code><span class="value">"header header"</span></code><br>
            <code><span class="value">"aside main"</span></code><br>
            <code><span class="value">"footer footer"</span></code>
        </p>

        <p>
            Este patrón crea un layout clásico con header, sidebar, contenido principal y footer.
        </p>

            <h4><code><span class="property">grid-row</span>;</code></h4>
        </div>

        <ul>

    <!-- ========== CARD 2: Explicación ========== -->

        <ul>
            <li>GRID / ITEMS</li>
            <li>02 / 03 →</li>
        </ul>

        <h3>Ítems de la cuadrícula.</h3>

<p>
    Los <code><span class="property">grid items</span></code> son los hijos directos del 
    <code><span class="property">grid container</span></code>.
    Podemos controlar su posición y el espacio que ocupan dentro del grid mediante las propiedades
    <code><span class="property">grid-column</span></code> y 
    <code><span class="property">grid-row</span></code>.
</p>

<p>
    Estas propiedades utilizan números de línea para indicar dónde comienza y termina el ítem
    (<code><span class="value">1 / 3</span></code>) y también pueden utilizar la palabra clave
    <code><span class="value">span</span></code> para indicar cuántas columnas o filas debe ocupar.
</p>

<p>
    También existe la propiedad corta
    <code><span class="property">grid-area</span></code>,
    que permite definir la posición del ítem mediante filas y columnas, o asignarlo a un área nombrada.
</p>

<p>
    Ejemplo:<br>
    <code><span class="property">grid-column</span>: <span class="value">1 / 3</span>;</code><br>
    <code><span class="property">grid-row</span>: <span class="value">span 2</span>;</code>
</p>
