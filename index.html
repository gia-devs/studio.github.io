    <script src="script.js"></script>
    <script>
// Seleccionamos todos los botones del aside
const buttons = document.querySelectorAll('.category-btn');

// Seleccionamos todas las secciones del main
const sections = document.querySelectorAll('.content-section');

// Recorremos cada botón
buttons.forEach(button => {
  button.addEventListener('click', () => {
    
    // 1. Quitamos la clase "active" de todos los botones
    buttons.forEach(btn => btn.classList.remove('active'));
    
    // 2. Le ponemos "active" al botón que se acaba de pulsar
    button.classList.add('active');
    
    // 3. Obtenemos el valor del data-section (lab, proyectos o gia)
    const sectionId = button.dataset.section;
    
    // 4. Quitamos "active" de todas las secciones
    sections.forEach(section => section.classList.remove('active'));
    
    // 5. Activamos solo la sección que corresponde
    const targetSection = document.getElementById(sectionId);
    if (targetSection) {
      targetSection.classList.add('active');
    }
  });
});
    </script>
