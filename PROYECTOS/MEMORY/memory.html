<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memory Game — LAV</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      color: #A0A0A0;
      background-color: #0A0A0A;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ========== BIENVENIDA ========== */
    .bienvenida {
      display: none;
      position: absolute;
      inset: 0;
      background: #0A0A0A;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 20;
    }
    .bienvenida.visible { display: flex; }

    .bienvenida h1 {
      font-size: 2.8rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #A0A0A0;
      margin-bottom: 2.5rem;
    }

    .bienvenida-botones {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ========== CABECERA ========== */
    .cabecera {
      padding: 0.8rem 2rem;
      border-bottom: 1px solid #1A1A1A;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      background: #0A0A0A;
    }

    .cabecera-titulo {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #666;
      margin-bottom: 0.2rem;
    }

    .cabecera-num {
      font-size: 1.8rem;
      color: #A0A0A0;
      letter-spacing: 0.05em;
    }

    .contadores {
      display: flex;
      gap: 2.5rem;
    }

    .control-nivel {
      background: transparent;
      border: 1px solid #1A1A1A;
      color: #A0A0A0;
      width: 1.6rem;
      height: 1.6rem;
      font-size: 0.9rem;
      cursor: pointer;
      border-radius: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .control-nivel:hover {
      border-color: #333;
      color: #fff;
    }
    .control-oculto { display: none; }

    /* ========== MAIN ========== */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 1.5rem;
    }

    .mesa {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      max-width: 42rem;
      gap: 0.6rem;
    }

    /* ========== TARJETAS ========== */
    .tarjeta {
      width: 4.8rem;
      height: 4.8rem;
      border-radius: 0.4rem;
      background: #111;
      border: 1px solid #1A1A1A;
      position: relative;
      transition: 0.3s;
      cursor: pointer;
      transform-style: preserve-3d;
    }

    .tarjeta__contenido {
      position: absolute;
      inset: 0;
      transform: rotateY(-180deg);
      backface-visibility: hidden;
      background: #1A1A1A;
      color: #A0A0A0;
      border-radius: 0.4rem;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      border: 1px solid #2A2A2A;
    }

    .tarjeta.descubierta {
      transform: rotateY(-180deg);
    }

    @keyframes error {
      10%, 90% { transform: rotateY(-180deg) translateX(-1px); }
      20%, 80% { transform: rotateY(-180deg) translateX(2px); }
      30%, 50%, 70% { transform: rotateY(-180deg) translateX(-4px); }
      40%, 60% { transform: rotateY(-180deg) translateX(4px); }
    }

    @keyframes acierto {
      from { transform: rotateY(-180deg) scale(1); opacity: 1; }
      30%  { transform: rotateY(-180deg) scale(1.08); opacity: 1; }
      to   { transform: rotateY(-180deg) scale(1); opacity: 0.3; }
    }

    .acertada { pointer-events: none; }
    .acertada .tarjeta__contenido {
      animation: acierto 1.2s ease-in-out forwards;
      border-color: #4A9EFF;
      color: #4A9EFF;
    }
    .error {
      animation: error 0.8s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* ========== MODALES ========== */
    .sube-nivel,
    .game-over,
    .end-game {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 10, 0.92);
      align-items: center;
      justify-content: center;
      z-index: 15;
    }
    .sube-nivel.visible,
    .game-over.visible,
    .end-game.visible {
      display: flex;
    }

    .modal {
      background: #111;
      border: 1px solid #1A1A1A;
      padding: 2.5rem 3rem;
      text-align: center;
      border-radius: 0.6rem;
      max-width: 90%;
    }

    .modal h2 {
      font-size: 1.4rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #A0A0A0;
      margin-bottom: 0.8rem;
    }

    .modal p {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 1.8rem;
    }

    /* ========== BOTONES ========== */
    button {
      cursor: pointer;
      border: 1px solid #1A1A1A;
      background: transparent;
      padding: 0.7rem 1.8rem;
      border-radius: 0.3rem;
      color: #A0A0A0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    button:hover {
      border-color: #4A9EFF;
      color: #4A9EFF;
    }

    .modal .reiniciar {
      background: transparent;
      border: none;
      color: #555;
      margin-top: 1rem;
      font-size: 0.7rem;
      text-transform: none;
      letter-spacing: 0.05em;
    }
    .modal .reiniciar:hover {
      color: #A0A0A0;
      border: none;
    }

    .sonido { display: none; }
    .cronometro-oculto { display: none; }

    /* ========== MENÚ NIVELES ========== */
    .selecciona-nivel {
      background: #0A0A0A;
      border-left: 1px solid #1A1A1A;
      position: fixed;
      width: 200px;
      right: 0;
      top: 0;
      bottom: 0;
      transform: translateX(200px);
      transition: transform 0.3s ease;
      padding: 2rem 1.5rem;
      z-index: 10;
    }
    .selecciona-nivel.visible {
      transform: translateX(0);
    }

    .selecciona-nivel ul {
      list-style: none;
      margin-top: 2.5rem;
    }
    .selecciona-nivel li {
      margin-bottom: 0.8rem;
      text-align: center;
    }
    .selecciona-nivel button {
      width: 100%;
      padding: 0.5rem;
      font-size: 0.75rem;
    }

    .cierra-niveles {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: transparent;
      border: none;
      color: #555;
      font-size: 1.4rem;
      cursor: pointer;
    }
    .cierra-niveles:hover {
      color: #A0A0A0;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Bienvenida -->
  <div id="bienvenida" class="bienvenida">
    <h1>Memory // LAV</h1>
    <div class="bienvenida-botones">
      <button id="juego-normal">Jugar</button>
      <button id="juego-relax">Modo relax</button>
    </div>
  </div>

  <!-- Cabecera -->
  <header class="cabecera">
    <div class="contadores">
      <div class="contador-item">
        <div class="cabecera-titulo">Movimientos</div>
        <div class="cabecera-num">
          <span id="mov">00</span>/<span id="mov-total">20</span>
        </div>
      </div>
      <div id="cronometro" class="contador-item">
        <div class="cabecera-titulo">Tiempo</div>
        <div class="cabecera-num">
          <span id="minutos">00</span>:<span id="segundos">00</span>
        </div>
      </div>
    </div>

    <div class="nivel">
      <div class="cabecera-titulo">Nivel</div>
      <div class="cabecera-num"><span id="nivel">01</span></div>
    </div>

    <button id="control-nivel" class="control-nivel">···</button>
  </header>

  <main>
    <div id="mesa" class="mesa"></div>

    <!-- Modal siguiente nivel -->
    <div id="subeNivel" class="sube-nivel">
      <div class="modal">
        <h2>Nivel completado</h2>
        <button id="subir">Siguiente</button>
        <button class="reiniciar">Reiniciar</button>
      </div>
    </div>

    <!-- Game Over -->
    <div id="gameOver" class="game-over">
      <div class="modal">
        <h2>Sin movimientos</h2>
        <p>Se agotaron los intentos</p>
        <button class="reiniciar">Reiniciar</button>
      </div>
    </div>

    <div id="timeOver" class="game-over">
      <div class="modal">
        <h2>Tiempo agotado</h2>
        <p>Se acabó el reloj</p>
        <button class="reiniciar">Reiniciar</button>
      </div>
    </div>

    <div id="endGame" class="end-game">
      <div class="modal">
        <h2>Completado</h2>
        <p>Todos los niveles superados</p>
        <button class="reiniciar">Reiniciar</button>
      </div>
    </div>
  </main>

  <!-- Menú niveles -->
  <div class="selecciona-nivel">
    <button id="cierra-niveles" class="cierra-niveles">×</button>
    <ul></ul>
  </div>

  <!-- Sonidos -->
  <audio src="sonidos/acierto.mp3" id="sonido-acierto" preload="auto"></audio>
  <audio src="sonidos/error.mp3" id="sonido-error" preload="auto"></audio>
  <audio src="sonidos/carta.mp3" id="sonido-carta" preload="auto"></audio>

  <script>
    // ===== VARIABLES =====
    var modoRelax = false;
    var movimientos = 0;
    var cronometro;
    var grupoTarjetas = [
      ["🦄", "🍦"],
      ["🌈", "👽"],
      ["👾", "🤖", "👹", "👺"],
      ["🤡", "💩", "🎃", "🙀"],
      ["☠️", "👾", "😽", "😼"]
    ];
    var nivelActual = 0;
    var niveles = [
      { tarjetas: grupoTarjetas[0], movimientosMax: 3 },
      { tarjetas: grupoTarjetas[0].concat(grupoTarjetas[1]), movimientosMax: 8 },
      { tarjetas: grupoTarjetas[0].concat(grupoTarjetas[1], grupoTarjetas[2]), movimientosMax: 12 },
      { tarjetas: grupoTarjetas[0].concat(grupoTarjetas[1], grupoTarjetas[2], grupoTarjetas[3]), movimientosMax: 25 },
      { tarjetas: grupoTarjetas[0].concat(grupoTarjetas[1], grupoTarjetas[2], grupoTarjetas[3], grupoTarjetas[4]), movimientosMax: 60 }
    ];

    // ===== BARAJA =====
    function barajaTarjetas(lasTarjetas) {
      var total = lasTarjetas.concat(lasTarjetas);
      return total.sort(function() { return 0.5 - Math.random(); });
    }

    function reparteTarjetas(lasTarjetas) {
      var mesa = document.querySelector("#mesa");
      var barajadas = barajaTarjetas(lasTarjetas);
      mesa.innerHTML = "";
      barajadas.forEach(function(emoji) {
        var div = document.createElement("div");
        div.innerHTML = "<div class='tarjeta' data-valor='" + emoji + "'><div class='tarjeta__contenido'>" + emoji + "</div></div>";
        mesa.appendChild(div);
      });
    }

    // ===== DESCUBRIR =====
    function descubrir() {
      var abiertas = document.querySelectorAll(".descubierta:not(.acertada)");
      if (abiertas.length > 1) return;

      this.classList.add("descubierta");
      document.querySelector("#sonido-carta").cloneNode().play();

      var descubiertas = document.querySelectorAll(".descubierta:not(.acertada)");
      if (descubiertas.length < 2) return;

      comparar(descubiertas);
      actualizaContador();

      if (document.querySelectorAll(".tarjeta:not(.acertada)").length === 0) {
        setTimeout(finalizar, 900);
      }
    }

    function comparar(tarjetas) {
      if (tarjetas[0].dataset.valor === tarjetas[1].dataset.valor) {
        acierto(tarjetas);
      } else {
        error(tarjetas);
      }
    }

    // ===== ACIERTO / ERROR =====
    function acierto(tarjetas) {
      tarjetas.forEach(function(t) { t.classList.add("acertada"); });
      document.querySelector("#sonido-acierto").play();
    }

    function error(tarjetas) {
      tarjetas.forEach(function(t) { t.classList.add("error"); });
      document.querySelector("#sonido-error").play();
      setTimeout(function() {
        tarjetas.forEach(function(t) {
          t.classList.remove("descubierta", "error");
        });
      }, 900);
    }

    // ===== CONTADOR =====
    function actualizaContador() {
      movimientos++;
      document.querySelector("#mov").innerText = movimientos < 10 ? "0" + movimientos : movimientos;
      if (movimientos > niveles[nivelActual].movimientosMax && !modoRelax) {
        gameOver();
      }
    }

    function maxContador() {
      var max = niveles[nivelActual].movimientosMax;
      document.querySelector("#mov-total").innerText = max < 10 ? "0" + max : max;
    }

    // ===== CRONÓMETRO =====
    function iniciaCronometro() {
      var seg = 10, min = 0;
      function tick() {
        seg--;
        if (seg < 0) { seg = 59; min--; }
        if (min < 0) {
          clearInterval(cronometro);
          timeOver();
          return;
        }
        document.querySelector("#minutos").innerText = min < 10 ? "0" + min : min;
        document.querySelector("#segundos").innerText = seg < 10 ? "0" + seg : seg;
      }
      cronometro = setInterval(tick, 1000);
    }

    // ===== FINALIZAR =====
    function finalizar() {
      clearInterval(cronometro);
      if (nivelActual < niveles.length - 1) {
        document.querySelector("#subeNivel").classList.add("visible");
      } else {
        document.querySelector("#endGame").classList.add("visible");
      }
    }

    function gameOver() {
      clearInterval(cronometro);
      document.querySelector("#gameOver").classList.add("visible");
    }

    function timeOver() {
      document.querySelector("#timeOver").classList.add("visible");
    }

    // ===== NIVELES =====
    function actualizaNivel() {
      var n = nivelActual + 1;
      document.querySelector("#nivel").innerText = n < 10 ? "0" + n : n;
    }

    function cargaNuevoNivel() {
      nivelActual++;
      actualizaNivel();
      iniciar();
    }

    function escribeNiveles() {
      var ul = document.querySelector(".selecciona-nivel ul");
      niveles.forEach(function(_, i) {
        var li = document.createElement("li");
        li.innerHTML = "<button class='nivel' data-nivel='" + i + "'>Nivel " + (i + 1) + "</button>";
        ul.appendChild(li);
      });
    }

    function cambiaNivel() {
      nivelActual = parseInt(this.dataset.nivel);
      actualizaNivel();
      iniciar();
    }

    // ===== INICIAR =====
    function iniciar() {
      movimientos = 0;
      reparteTarjetas(niveles[nivelActual].tarjetas);
      document.querySelector("#mov").innerText = "00";
      maxContador();

      ["#endGame", "#timeOver", "#gameOver", "#subeNivel"].forEach(function(id) {
        document.querySelector(id).classList.remove("visible");
      });
      document.querySelector(".selecciona-nivel").classList.remove("visible");

      document.querySelectorAll(".tarjeta").forEach(function(t) {
        t.addEventListener("click", descubrir);
      });

      if (!modoRelax) {
        iniciaCronometro();
      } else {
        document.querySelector("#cronometro").classList.add("cronometro-oculto");
      }
    }

    function reiniciar() {
      nivelActual = 0;
      actualizaNivel();
      iniciar();
    }

    function iniciaJuegoNormal() {
      modoRelax = false;
      document.querySelector("#bienvenida").classList.remove("visible");
      document.querySelector(".control-nivel").classList.add("control-oculto");
      iniciar();
    }

    function iniciaJuegoRelax() {
      modoRelax = true;
      document.querySelector("#bienvenida").classList.remove("visible");
      iniciar();
    }

    // ===== EVENTOS =====
    escribeNiveles();

    document.querySelectorAll(".reiniciar").forEach(function(btn) {
      btn.addEventListener("click", reiniciar);
    });
    document.querySelector("#juego-normal").addEventListener("click", iniciaJuegoNormal);
    document.querySelector("#juego-relax").addEventListener("click", iniciaJuegoRelax);
    document.querySelector("#control-nivel").addEventListener("click", function(e) {
      e.stopPropagation();
      document.querySelector(".selecciona-nivel").classList.toggle("visible");
    });
    document.querySelector("#cierra-niveles").addEventListener("click", function() {
      document.querySelector(".selecciona-nivel").classList.remove("visible");
    });
    document.querySelectorAll(".nivel").forEach(function(btn) {
      btn.addEventListener("click", cambiaNivel);
    });
    document.querySelector("#subir").addEventListener("click", cargaNuevoNivel);
    document.body.addEventListener("click", function(e) {
      if (!e.target.closest(".selecciona-nivel") && !e.target.closest("#control-nivel")) {
        document.querySelector(".selecciona-nivel").classList.remove("visible");
      }
    });
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") {
        document.querySelector(".selecciona-nivel").classList.remove("visible");
      }
    });

    document.querySelector("#bienvenida").classList.add("visible");
  </script>
</body>
</html>
